name: Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml', 'desktop/**', 'desktop_bridge.py', 'behavioral.py', 'runtime_v2.py', 'chat_checks.py', 'code_runner.py']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appendix-b-windows-preview
  cancel-in-progress: false

jobs:
  windows-x64:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - name: Read app version
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if (-not ($v -match '^\d+\.\d+\.\d+$')) { throw "Bad version $v" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
      - name: Python regression tests
        run: python -m unittest discover -v
      - name: Install pinned Electron and check desktop scripts
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Electron 42+ downloads its executable on demand, not during npm install.
          & .\node_modules\.bin\install-electron.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) { throw 'Electron Windows binary was not downloaded' }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble portable Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'Appendix-B'
          Copy-Item -LiteralPath 'desktop/node_modules/electron/dist' -Destination $stage -Recurse
          Rename-Item -LiteralPath (Join-Path $stage 'electron.exe') -NewName 'Appendix B.exe'
          # Brand the executable: icon, product name and version in Explorer/taskbar.
          $env:APPENDIX_EXE = Join-Path $stage 'Appendix B.exe'
          $env:APPENDIX_ICO = (Resolve-Path 'desktop/icon.ico').Path
          Push-Location desktop
          node -e "const m=require('rcedit');const f=m.rcedit||m.default||m;const v=process.env.APP_VERSION;f(process.env.APPENDIX_EXE,{icon:process.env.APPENDIX_ICO,'file-version':v,'product-version':v,'version-string':{ProductName:'Appendix B',FileDescription:'Appendix B Cognitive Research Lab',CompanyName:'BostonAI.io',LegalCopyright:'Aaron Grace',OriginalFilename:'Appendix B.exe',InternalName:'Appendix B'}}).then(()=>console.log('exe branded'),e=>{console.error(e);process.exit(1)})"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $appDir = Join-Path $stage 'resources/app'
          $desktop = Join-Path $appDir 'desktop'
          New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          foreach ($file in @('main.cjs','preload.cjs','index.html','renderer.js','README.md','icon.png','icon.ico')) {
            Copy-Item -LiteralPath "desktop/$file" -Destination $desktop
          }
          foreach ($file in @('runtime_v2.py','behavioral.py','desktop_bridge.py','chat_checks.py','code_runner.py','README.md')) {
            Copy-Item -LiteralPath $file -Destination $appDir
          }
          @{name='appendix-b-desktop-lab'; productName='Appendix B'; version=$env:APP_VERSION; main='desktop/main.cjs'} | ConvertTo-Json | Set-Content (Join-Path $appDir 'package.json') -Encoding utf8
          $pyHome = (python -c "import sys; print(sys.base_prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonDir = Join-Path $stage 'resources/python'
          Copy-Item -LiteralPath $pyHome -Destination $pythonDir -Recurse
          & (Join-Path $pythonDir 'python.exe') -c "import sqlite3, ssl, sys; assert sys.version_info >= (3,10)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'desktop/README.md' -Destination (Join-Path $stage 'README.txt')
          "APPENDIX_STAGE=$stage" >> $env:GITHUB_ENV
      - name: Packaged desktop launch smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:APPENDIX_STAGE 'Appendix B.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Desktop smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test exit code $($p.ExitCode)" }
      - name: Compile and test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $script = Join-Path $env:RUNNER_TEMP 'appendix.iss'
          @"
          [Setup]
          AppId=AppendixBResearchLab
          AppName=Appendix B
          AppVersion=$($env:APP_VERSION)
          AppPublisher=Appendix B (with credit to DinoClaw)
          DefaultDirName={localappdata}\Programs\Appendix B
          DefaultGroupName=Appendix B
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=$out
          OutputBaseFilename=Appendix-B-Setup-v$($env:APP_VERSION)-win-x64
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayIcon={app}\Appendix B.exe
          SetupIconFile=$((Resolve-Path 'desktop/icon.ico').Path)
          WizardStyle=modern
          AppPublisherURL=https://github.com/AaronGrace978/appendix-b-substrate
          VersionInfoVersion=$($env:APP_VERSION)
          [Files]
          Source: "$env:APPENDIX_STAGE\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"
          [Icons]
          Name: "{group}\Appendix B"; Filename: "{app}\Appendix B.exe"
          Name: "{autodesktop}\Appendix B"; Filename: "{app}\Appendix B.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\Appendix B.exe"; Description: "Launch Appendix B"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content $script -Encoding utf8
          & $compiler $script
          $setup = Join-Path $out "Appendix-B-Setup-v$($env:APP_VERSION)-win-x64.exe"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setup)) { throw 'Installer build failed' }
          $testDir = Join-Path $env:RUNNER_TEMP 'installed-appendix'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $testDir + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath (Join-Path $testDir 'Appendix B.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Installed app timed out' }
          if ($p.ExitCode -ne 0) { throw "Installed app failed: $($p.ExitCode)" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$sha  Appendix-B-Setup-v$($env:APP_VERSION)-win-x64.exe" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          "APPENDIX_ASSETS=$out" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Appendix-B-Windows-x64
          path: ${{ runner.temp }}/release-assets/*
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$($env:APP_VERSION)"
          # Inside this @" "@ here-string a backtick is PowerShell's escape character: write ``code`` for `code`.
          $notes = @"
          ## Appendix B v$($env:APP_VERSION) — Models that check their work

          **New in 0.8.0: number-theory checks**
          - **Many more claims checked.** Besides arithmetic, primes, letter counts and Collatz steps, the ✓ / ✗ under a reply now covers gcd and lcm, factorials, binomials, φ(n), divisibility, congruences (``2^100 ≡ 2 (mod 7)``, computed with modular powers), perfect squares, cubes and powers, prime factorizations, divisor counts and sums, digit counts and sums, the nth prime, prime counts and Fibonacci numbers.
          - **Plain text or LaTeX.** ``\binom{10}{3}``, ``\equiv``, ``\pmod{7}``, ``\times`` and ``\varphi`` are understood.
          - **Careful, not noisy.** A number has to stand alone to be a claim, so "1 + 2 + 3 is divisible by 4" or "Run 3 has 4 divisors" are not read as claims about 3. Numbers beyond the checker's bounds are skipped, never marked ✗.

          **New in 0.7.3**
          - **Checks see through function notation.** A line like ``f(71) = 71² − 61 × 71 + 971 = 1681`` is now checked: parts Python can't evaluate are set aside and the rest of the equation is still verified.
          - **Cleaner tracebacks on Windows.** When the model's code fails, it now sees only its own code in the error, not the runner's internal guard lines (Windows CRLF line endings broke the filter).
          - README: a real session where the model caught and fixed a bug in its own checker, plus a runnable claim-check example.

          **New in 0.7.2**
          - **One protocol pass.** With Protocol and Code both on, the model runs code during VERIFY and continues from there, instead of restarting at DECOMPOSE after the results. Repeated phases are labelled *continued*.
          - **Readable maths.** Models are asked for plain-text maths; LaTeX that slips through (\[ \], \( \), cases, \boxed, \frac, superscripts, arrows) is rendered as clean Unicode.
          - **Smarter checks.** Collatz claims written in LaTeX (10{,}971 … 267 steps) are now checked, and nearby numbers are no longer mistaken for the claim.
          - **New README** with real screenshots, runnable examples (``examples/``) and tests that keep them honest.

          **New in 0.7.1: code running that models actually use**
          - Code now runs through each provider's built-in **tool calling** (Ollama, OpenRouter, Anthropic, OpenAI). Models like Kimi were trained to call tools this way and ignored the old text convention: they said "I'll compute it" and stopped. Models that don't support tools fall back automatically to code blocks.
          - **Automatic retries** on provider server errors (HTTP 500/502/503/504, 429 rate limits, dropped connections), with short backoff, before any text has streamed. Ollama Cloud's intermittent "Internal Server Error" no longer kills the reply.

          **New in 0.7: models can run code**
          - Turn on **Code** in the chat box and the model can write a Python block, have the app run it, read the output, and keep going: guess first, then verify with code instead of grinding through arithmetic by hand.
          - Each run shows as a card in the reply: the code (collapsible), its output, and whether it succeeded.
          - Runs are restricted: 15-second limit, no network, no process spawning, and file reads and writes only inside a throwaway temp folder, so code can't read your files and send them to a cloud model. This is a guard-rail, not a security sandbox; use models you trust.
          - Up to 4 rounds of runs per reply. Collatz step-count claims are now checked independently too.

          **New in 0.6.2: reasoning models fixed**
          - **No more "empty model output"** with reasoning models such as DeepSeek v4 Pro, Kimi and gpt-oss on Ollama Cloud. Their reasoning now streams live in a collapsible **Reasoning** panel, followed by the answer.
          - **Higher output limits** (32k tokens; 16k for Anthropic) so a model has room to reason and still answer.
          - If a model only reasons and never answers, you see its reasoning plus a clear note, and your prompt goes back into the box so you can retry.
          - Replies cut off at the output limit are labelled; old error cards clear when you send again.
          - Switching providers no longer wipes your API key. Keys are remembered per provider for the session, in memory only.

          **New in 0.6.1**
          - **Scrolling fixed.** Only the conversation scrolls; the header, model picker and sidebar stay in place. A *Latest* button appears when you scroll up during a reply.
          - **Readable replies.** Markdown renders properly (paragraphs, numbered and bulleted lists, bold, italics, headings, code blocks). Each protocol phase is its own colored card.
          - **Chat polish.** Your messages are right-aligned bubbles; each model reply has a Copy button.

          **New in 0.6**
          - **Streaming replies.** One long-running substrate process replaces a fresh Python launch per request; text appears as the model writes it, and **Stop** cancels just that reply.
          - **Chat and experiments run at the same time** (requests are handled concurrently by id).
          - **Independent checks in chat.** Arithmetic, primality and letter-count claims in a reply are recomputed in Python and shown as ✓ / ✗ under the message. A model that writes 91 is prime gets caught.
          - **Chat feeds the substrate.** Each checked claim updates that model's persistent state (surprise, strain, confidence…), shown in the side rail and kept across sessions.

          Also includes 0.5: chat tab, live model dropdown, Protocol mode, redesigned interface, app icon.

          **Install (Windows x64)**
          Download and run ``Appendix-B-Setup-v$($env:APP_VERSION)-win-x64.exe``. Python and Electron are bundled; nothing else to install.
          Unsigned build: if SmartScreen warns, choose *More info → Run anyway*.

          Providers: OpenAI, Anthropic, OpenRouter, Ollama Cloud, Ollama Local. Bring your own keys; keys stay in memory only.
          Research software; model critique is not mathematical proof.

          With credit to [DinoClaw](https://github.com/AaronGrace978/DinoClaw).
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content $notesFile -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Keep the published installer; only refresh the notes.
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host 'Release already exists; kept its assets and refreshed its notes.'
            exit 0
          }
          gh release create $tag (Join-Path $env:APPENDIX_ASSETS "Appendix-B-Setup-v$($env:APP_VERSION)-win-x64.exe") (Join-Path $env:APPENDIX_ASSETS 'SHA256SUMS.txt') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Appendix B v$($env:APP_VERSION)" --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
